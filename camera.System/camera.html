<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>얼굴 인식 출석</title>
    <style>
        :root { --ink: #203039; --muted: #718087; --line: #dce6e5; --paper: #f5f8f7; }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: var(--paper); font-family: "Noto Sans KR", sans-serif; }
        .shell { width: min(800px, calc(100% - 36px)); margin: auto; padding: 32px 0 48px; }
        .topbar, .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .topbar { margin-bottom: 42px; }
        .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; color: white; background: var(--ink); border-radius: 10px; font-size: 12px; font-weight: bold; }
        .brand-name, h1, .control-title { margin: 0; }
        .brand-subtitle, .eyebrow, .helper, .status, .control-note { color: var(--muted); font-size: .85rem; }
        .brand-subtitle { margin: 3px 0 0; }
        .eyebrow { margin: 0 0 8px; color: #168a72; font-weight: bold; letter-spacing: .08em; }
        h1 { font-size: clamp(28px, 6vw, 46px); line-height: 1.15; }
        .intro { margin-bottom: 26px; }
        .intro h1 { margin-bottom: 10px; }
        .back-link { color: var(--muted); font-size: 13px; text-decoration: none; }
        .capture-layout { max-width: 650px; }
        .stage-panel { padding: 10px; background: white; border: 1px solid var(--line); border-radius: 12px; }
        .camera-frame { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #202b30; border-radius: 7px; }
        video, canvas { display: block; width: 100%; height: 100%; object-fit: cover; }
        video { transform: scaleX(-1); }
        canvas { display: none; }
        #countdown { position: absolute; inset: 0; display: grid; place-items: center; color: white; background: #0005; font-size: 5rem; }
        #countdown[hidden] { display: none; }
        .status { margin: 12px 2px 2px; }
        .control-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
        .control-title, .control-note { grid-column: 1 / -1; }
        button { padding: 11px 12px; color: var(--ink); background: white; border: 1px solid var(--line); border-radius: 7px; font: inherit; cursor: pointer; }
        #takePhoto { color: white; background: var(--ink); border-color: var(--ink); }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .control-note { margin: 0; }
        @media (max-width: 480px) { .shell { width: min(100% - 24px, 500px); padding-top: 22px; } .control-panel { grid-template-columns: 1fr; } .control-title, .control-note { grid-column: auto; } }
    </style>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">미림</span>
                <div>
                    <p class="brand-name">CLASSROOM</p>
                    <p class="brand-subtitle">얼굴 인식 출석</p>
                </div>
            </div>
            <a href="main.html">출결 화면으로</a>
        </header>

        <section class="intro">
            <p class="eyebrow">FACE CHECK</p>
            <h1>얼굴을 화면 중앙에<br>맞춰주세요</h1>
            <p class="helper">촬영 후 등록된 학생 사진과 비교하여 출결을 확인합니다.</p>
        </section>

        <section class="capture-layout">
            <div class="stage-panel">
                <div class="camera-frame">
                    <video id="camera" autoplay playsinline></video>
                    <canvas id="photo"></canvas>
                    <div id="countdown" hidden></div>
                </div>
                <p class="status" id="cameraStatus">카메라를 준비하는 중입니다.</p>
            </div>

            <aside class="control-panel">
                <h2 class="control-title">촬영하기</h2>
                <button type="button" id="takePhoto" disabled>사진 촬영</button>
                <button type="button" id="backToAttendance">출결 화면으로</button>
                <p class="control-note">사진 촬영을 누르면 3초 후 촬영됩니다.</p>
            </aside>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <script src="camera.js"></script>
</body>
</html>
