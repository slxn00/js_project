<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>회원가입 - 등교 체크인</title>

    <link rel="stylesheet" href="/src/css/style.css" />
</head>

<body>
    <header class="top-header">
        <span class="logo-text">등교 체크인 - 우리 반 출결 도우미</span>
    </header>

    <main class="signup-container">
        <div class="signup-header">
            <h1>SIGN UP</h1>
            <p>서비스를 이용하려면 회원가입이 필요합니다</p>
        </div>

        <div class="signup-card">
            <!-- 1. 소셜 로그인 연동 표시 뱃지 (기본 숨김) -->
            <div id="social-badge" class="social-badge hidden">
                <span id="provider-icon"></span>
                <span id="provider-name"></span> 연동 계정
            </div>

            <!-- 회원가입 폼 -->
            <form id="signup-form" novalidate>
                <div class="input-group">
                    <label for="name">성함 <span class="required">*</span></label>
                    <input type="text" id="name" placeholder="Ex) 홍길동" />
                </div>

                <div class="input-group">
                    <label for="email">이메일 <span class="optional-text">(선택 - 계정 찾기용)</span></label>
                    <div class="input-with-btn">
                        <input type="email" id="email" placeholder="Email" autocomplete="email" />
                        <button type="button" id="send-otp-btn" class="inline-btn" disabled>인증발송</button>
                    </div>
                </div>

                <div id="otp-group" class="input-group hidden">
                    <label for="otp">인증번호 6자리</label>
                    <div class="input-with-btn">
                        <input type="text" id="otp" placeholder="123456" maxlength="6" />
                        <button type="button" id="verify-otp-btn" class="inline-btn primary">인증확인</button>
                    </div>
                    <span id="otp-status-text" class="status-text"></span>
                </div>

                <div id="password-group" class="input-group">
                    <label for="password">비밀번호 <span class="required">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Password (6자리 이상)"
                            autocomplete="new-password" />
                        <button type="button" class="eye-btn" data-target="password">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="#94a3b8" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="password-confirm-group" class="input-group">
                    <label for="password-confirm">비밀번호 재확인 <span class="required">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="password-confirm" placeholder="Password"
                            autocomplete="new-password" />
                        <button type="button" class="eye-btn" data-target="password-confirm">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="#94a3b8" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="signup-btn" class="submit-btn">가입하기</button>
            </form>

            <div id="social-section">
                <div class="divider">
                    <span>또는</span>
                </div>

                <div class="social-login-group">
                    <button type="button" id="kakao-signup-btn" class="kakao-btn">
                        <svg class="kakao-icon" width="20" height="20" viewBox="0 0 24 24">
                            <path fill="#000000"
                                d="M12 3c-4.97 0-9 3.185-9 7.115 0 2.557 1.707 4.8 4.27 6.054-.188.702-.682 2.545-.78 2.94-.12.484.177.478.373.348.155-.102 2.463-1.674 3.456-2.35.547.08 1.107.123 1.681.123 4.97 0 9-3.186 9-7.115S16.97 3 12 3z" />
                        </svg>
                        <span>카카오로 시작하기</span>
                    </button>

                    <button type="button" id="google-signup-btn" class="google-btn">
                        <svg class="google-icon" width="20" height="20" viewBox="0 0 24 24">
                            <path fill="#4285F4"
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="#34A853"
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="#FBBC05"
                                d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z" />
                            <path fill="#EA4335"
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                        </svg>
                        <span>Google 계정으로 회원가입</span>
                    </button>
                </div>
            </div>

            <div class="signup-footer">
                <span>계정이 있으신가요?</span>
                <a href="/login.html" class="login-link">로그인</a>
            </div>
        </div>
    </main>

    <script type="module" src="/src/js/signup.js"></script>
</body>

</html>
