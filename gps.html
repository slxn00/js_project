<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>GPS 길찾기</title>
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;
            background: #f5f6f8;
        }

        header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #666;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .row input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4f7cff;
            color: white;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        .location-btn {
            background: #555;
        }

        .recommend-btn {
            background: #222;
            width: 100%;
            margin-top: 5px;
        }

        #status {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            background: #f0f2f5;
            color: #333;
            min-height: 44px;
        }

        #map {
            width: 100%;
            height: 550px;
            border-radius: 12px;
            overflow: hidden;
            background: #ddd;
        }

        .result {
            background: white;
            margin-top: 16px;
            padding: 16px;
            border-radius: 12px;
            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        .result strong {
            font-size: 18px;
        }

        @media (max-width: 600px) {

            .row {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            #map {
                height: 450px;
            }
        }

    </style>
</head>


<body>

<header>
    <h1>GPS 길찾기</h1>
    <p>출발지와 목적지를 입력하면 카카오 지도로 경로를 보여줍니다.</p>
</header>


<div class="container">

    <div class="search-box">

        <div class="row">

            <input
                id="startInput"
                type="text"
                placeholder="출발지"
                value="서울역"
            >

            <button
                id="currentLocationBtn"
                class="location-btn"
            >
                현재 위치
            </button>

        </div>


        <div class="row">

            <input
                id="endInput"
                type="text"
                placeholder="목적지"
                value="강남역"
            >

        </div>


        <button
            id="routeBtn"
            class="recommend-btn"
        >
            경로 찾기
        </button>


        <div id="status">
            지도를 불러오는 중...
        </div>

    </div>


    <div id="map"></div>


    <div
        id="result"
        class="result"
        style="display:none;"
    >
        <strong id="resultTitle"></strong>

        <p id="resultInfo"></p>
    </div>

</div>


<!--
    ⚠️ 여기에 Kakao JavaScript 키 입력
-->
<script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d6d50b0167a0f0a5b24649efa17ca972&libraries=services&autoload=false"
></script>


<script>

    let map = null;

    let startMarker = null;

    let endMarker = null;

    let routeLine = null;

    let currentStartPoint = null;


    // =====================================
    // 상태 표시
    // =====================================
    function setStatus(message) {

        document.getElementById("status")
            .textContent = message;

    }


    // =====================================
    // SDK 오류
    // =====================================
    function sdkLoadError() {

        setStatus(
            "Kakao 지도 SDK를 불러오지 못했습니다. JavaScript 키를 확인하세요."
        );

    }


    // =====================================
    // 지도 초기화
    // =====================================
    function initMap() {

        try {

            const center =
                new kakao.maps.LatLng(
                    37.5665,
                    126.9780
                );

            map = new kakao.maps.Map(
                document.getElementById("map"),
                {
                    center: center,
                    level: 7
                }
            );

            setStatus(
                "지도 준비 완료. 경로 찾기를 눌러주세요."
            );

        } catch (error) {

            console.error(error);

            setStatus(
                "카카오 지도를 초기화하지 못했습니다."
            );

        }

    }


    // =====================================
    // JSON 안전하게 받기
    // =====================================
    async function fetchJson(url) {

        const response =
            await fetch(url);

        const text =
            await response.text();


        // JSON인지 먼저 확인
        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        if (
            !contentType
                .toLowerCase()
                .includes("application/json")
        ) {

            console.error(
                "JSON이 아닌 서버 응답:",
                text
            );

            throw new Error(
                "서버가 JSON이 아닌 응답을 보냈습니다."
            );

        }


        let data;

        try {

            data = JSON.parse(text);

        } catch (error) {

            console.error(
                "JSON 파싱 실패:",
                text
            );

            throw new Error(
                "서버 응답을 JSON으로 읽을 수 없습니다."
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "서버 요청에 실패했습니다."
            );

        }


        return data;
    }


    // =====================================
    // 주소 검색
    // =====================================
    async function geocode(query) {

        const url =
            `/api/geocode?query=${encodeURIComponent(query)}`;

        const data =
            await fetchJson(url);

        if (
            !data.success ||
            !Number.isFinite(data.lat) ||
            !Number.isFinite(data.lng)
        ) {

            throw new Error(
                data.error ||
                `"${query}" 위치를 찾을 수 없습니다.`
            );

        }

        return {
            lat: data.lat,
            lng: data.lng,
            label: data.label || query
        };

    }


    // =====================================
    // 마커 삭제
    // =====================================
    function clearMarkers() {

        if (startMarker) {

            startMarker.setMap(null);

            startMarker = null;

        }


        if (endMarker) {

            endMarker.setMap(null);

            endMarker = null;

        }

    }


    // =====================================
    // 경로 삭제
    // =====================================
    function clearRoute() {

        if (routeLine) {

            routeLine.setMap(null);

            routeLine = null;

        }

    }


    // =====================================
    // 경로 찾기
    // =====================================
    async function findRoute() {

        if (!map) {

            setStatus(
                "지도가 아직 준비되지 않았습니다."
            );

            return;

        }


        const startText =
            document.getElementById(
                "startInput"
            ).value.trim();

        const endText =
            document.getElementById(
                "endInput"
            ).value.trim();


        if (!startText) {

            setStatus(
                "출발지를 입력해주세요."
            );

            return;

        }


        if (!endText) {

            setStatus(
                "목적지를 입력해주세요."
            );

            return;

        }


        try {

            setStatus(
                "주소를 검색하는 중..."
            );


            // -------------------------------
            // 출발지
            // -------------------------------
            let startPoint;

            if (currentStartPoint) {

                startPoint =
                    currentStartPoint;

            } else {

                startPoint =
                    await geocode(startText);

            }


            // -------------------------------
            // 목적지
            // -------------------------------
            const endPoint =
                await geocode(endText);


            setStatus(
                "경로를 계산하는 중..."
            );


            // -------------------------------
            // 서버에 좌표 전달
            // lat,lng
            // -------------------------------
            const routeUrl =
                `/api/route` +
                `?start=${encodeURIComponent(
                    `${startPoint.lat},${startPoint.lng}`
                )}` +
                `&end=${encodeURIComponent(
                    `${endPoint.lat},${endPoint.lng}`
                )}`;


            const route =
                await fetchJson(routeUrl);


            if (
                !route.points ||
                route.points.length === 0
            ) {

                throw new Error(
                    "경로 좌표를 받지 못했습니다."
                );

            }


            // -------------------------------
            // 기존 표시 제거
            // -------------------------------
            clearMarkers();

            clearRoute();


            // -------------------------------
            // 마커
            // -------------------------------
            startMarker =
                new kakao.maps.Marker({
                    position:
                        new kakao.maps.LatLng(
                            startPoint.lat,
                            startPoint.lng
                        ),
                    map: map
                });


            endMarker =
                new kakao.maps.Marker({
                    position:
                        new kakao.maps.LatLng(
                            endPoint.lat,
                            endPoint.lng
                        ),
                    map: map
                });


            // -------------------------------
            // 경로
            const path =
                route.points.map(
                    point =>
                        new kakao.maps.LatLng(
                            point[0],
                            point[1]
                        )
                );


            routeLine =
                new kakao.maps.Polyline({
                    map: map,
                    path: path,
                    strokeWeight: 6,
                    strokeColor: "#4f7cff",
                    strokeOpacity: 0.85,
                    strokeStyle: "solid"
                });


            // 지도 범위 맞추기
            const bounds =
                new kakao.maps.LatLngBounds();


            bounds.extend(
                new kakao.maps.LatLng(
                    startPoint.lat,
                    startPoint.lng
                )
            );


            bounds.extend(
                new kakao.maps.LatLng(
                    endPoint.lat,
                    endPoint.lng
                )
            );


            for (const point of path) {

                bounds.extend(point);

            }


            map.setBounds(bounds);


            // 거리 / 시간
            const distance =
                route.distance || 0;

            const duration =
                route.duration || 0;


            const distanceText =
                distance >= 1000
                    ? `${(distance / 1000).toFixed(1)} km`
                    : `${Math.round(distance)} m`;


            const durationText =
                `${Math.round(duration / 60)}분`;


            document.getElementById(
                "result"
            ).style.display = "block";


            document.getElementById(
                "resultTitle"
            ).textContent =
                `${startPoint.label} → ${endPoint.label}`;


            document.getElementById(
                "resultInfo"
            ).textContent =
                `거리: ${distanceText} / 예상 시간: ${durationText}`;


            setStatus(
                "경로를 표시했습니다."
            );


        } catch (error) {

            console.error(error);

            setStatus(
                error.message
            );

        }

    }



    // 현재 위치
    function useCurrentLocation() {

        if (!navigator.geolocation) {

            setStatus(
                "이 브라우저에서는 위치 기능을 사용할 수 없습니다."
            );

            return;

        }


        setStatus(
            "현재 위치를 가져오는 중..."
        );


        navigator.geolocation.getCurrentPosition(

            position => {

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;


                currentStartPoint = {
                    lat: lat,
                    lng: lng,
                    label: "현재 위치"
                };


                document.getElementById(
                    "startInput"
                ).value = "현재 위치";


                const positionObj =
                    new kakao.maps.LatLng(
                        lat,
                        lng
                    );


                map.setCenter(
                    positionObj
                );


                map.setLevel(5);


                clearMarkers();


                startMarker =
                    new kakao.maps.Marker({
                        position: positionObj,
                        map: map
                    });


                setStatus(
                    "현재 위치를 찾았습니다. 경로 찾기를 눌러주세요."
                );

            },

            error => {

                console.error(error);

                setStatus(
                    "현재 위치를 가져오지 못했습니다. 브라우저 위치 권한을 확인해주세요."
                );

            }

        );

    }

    document
        .getElementById("routeBtn")
        .addEventListener(
            "click",
            findRoute
        );


    document
        .getElementById("currentLocationBtn")
        .addEventListener(
            "click",
            useCurrentLocation
        );


    document
        .getElementById("startInput")
        .addEventListener(
            "input",
            () => {

                currentStartPoint = null;

            }
        );


    // Kakao SDK 로딩
    if (
        typeof kakao !== "undefined" &&
        kakao.maps
    ) {

        kakao.maps.load(
            initMap
        );

    } else {

        setStatus(
            "Kakao 지도 SDK를 불러오지 못했습니다. JavaScript 키를 확인하세요."
        );

    }

</script>

</body>
</html>
