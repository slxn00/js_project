<!DOCTYPE html>
<html lang="ko">

<head>
    <link rel="icon" type="image/png" href="/js_project_icon.png">
    <link rel="icon" href="/js_project_icon.png">
    <link rel="apple-touch-icon" href="/ios_icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>관리자 · 내 클래스</title>

    <link rel="stylesheet" href="/src/css/main.css">
    <link rel="stylesheet" href="/src/css/admin.css">
    <script type="module" src="/src/js/admin.js"></script>
    <script type="module" src="/src/js/admin-calendar.js"></script>
</head>


<body>
    <!-- 학급 생성 모달 -->
    <div id="createClassModal" class="class-modal-overlay" hidden>
        <iframe id="createClassFrame" title="학급 생성하기" src="about:blank"></iframe>
    </div>


    <div class="app">

        <div class="app-layout">

            <!-- 왼쪽: 학급 정보 및 학사일정 안내 -->
            <main class="main-content" aria-label="학급 메인 콘텐츠">
                <div class="admin-overview">
                    <div class="admin-overview-heading">
                        <span class="overview-eyebrow">CLASSROOM DASHBOARD</span>
                        <h1>우리 학급 한눈에 보기</h1>
                        <p id="overviewDate">학급 관리 화면</p>
                    </div>
                    <section class="calendar-panel" aria-labelledby="adminCalendarTitle">
                        <div class="calendar-panel-top">
                            <div><span class="overview-eyebrow">SCHOOL CALENDAR</span>
                                <h2 id="adminCalendarTitle">학사일정</h2>
                            </div>
                            <div class="calendar-nav">
                                <button type="button" id="calendarPrev" aria-label="이전 달">‹</button>
                                <strong id="calendarMonth" aria-live="polite"></strong>
                                <button type="button" id="calendarNext" aria-label="다음 달">›</button>
                            </div>
                        </div>
                        <div class="calendar-weekdays" aria-hidden="true">
                            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
                        </div>
                        <div id="calendarDays" class="calendar-days" role="group" aria-label="학사일정 날짜 선택"></div>
                        <div class="calendar-day-detail" aria-live="polite">
                            <strong id="calendarSelectedDate">날짜를 선택해 주세요</strong>
                            <p id="calendarDayEvents">등록된 학사일정이 아직 없어요.</p>
                        </div>
                        <p class="calendar-footnote">현재 달력은 날짜 확인용입니다. 학사일정 저장·공유 기능은 Supabase 연결 후 추가할 수 있어요.</p>
                    </section>
                </div>
            </main>

            <!-- 오른쪽: 기존 관리자 패널 -->
            <aside class="sidebar">

                <header class="sidebar-header">

                    <div class="profile-row">
                        <div class="profile-avatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                                <circle cx="12" cy="8" r="4"></circle>
                                <path d="M4.5 21c0-4 3-7 7.5-7s7.5 3 7.5 7">
                                </path>
                            </svg>
                        </div>

                        <div class="profile-details">
                            <strong id="teacherName">teacher</strong>
                            <span id="teacherEmail">계정 확인 중...</span>
                            <small id="accountRole" class="account-role">학급 확인 중</small>
                        </div>

                        <button type="button" id="settingsButton" class="settings-button" aria-label="설정">
                            ⚙
                        </button>
                    </div>

                    <!-- 사이드바 탭 -->
                    <nav class="tabs" aria-label="학급 메뉴">

                        <button type="button" class="tab active" data-tab="classes" aria-pressed="true">
                            내 클래스
                        </button>

                        <button type="button" class="tab" data-tab="members" aria-pressed="false" hidden>
                            멤버
                        </button>

                        <button type="button" class="tab" data-tab="board">
                            게시판
                        </button>

                    </nav>
                </header>

                <!-- 탭별 내용 -->
                <div class="sidebar-body">

                    <section id="membersPanel" class="tab-panel" hidden>
                        <div class="empty-state">
                            <p>학급 정보를 불러오고 있어요.</p>
                        </div>
                    </section>

                    <section id="classesPanel" class="tab-panel">
                        <div class="empty-state">
                            <p>학급 정보를 불러오고 있어요.</p>
                        </div>
                    </section>

                    <section id="boardPanel" class="tab-panel" hidden>
                        <div class="empty-state">
                            <p>게시판은 추후 추가될 예정입니다.</p>
                        </div>
                    </section>

                </div>

                <div class="sidebar-actions">
                    <button type="button" id="joinClassButton" class="join-class-button" aria-haspopup="dialog"
                        disabled>학급 생성하기</button>
                    <p id="joinClassSummary" class="join-class-summary" role="status" hidden></p>
                </div>

            </aside>

        </div>
    </div>

    <dialog id="joinClassDialog" class="join-class-dialog" aria-labelledby="joinClassTitle">
        <button type="button" id="closeJoinClass" class="join-close" aria-label="학급 입장 닫기">×</button>
        <h2 id="joinClassTitle" class="visually-hidden">학급 입장</h2>
        <form id="joinClassForm" novalidate>
            <label class="join-name-label" for="joinName">성함</label>
            <input id="joinName" class="join-name-input" name="studentName" placeholder="김길동" autocomplete="name"
                maxlength="50" required />

            <fieldset class="join-code-group">
                <legend>학급코드</legend>
                <div class="join-code-inputs">
                    <input class="join-code-digit" aria-label="학급코드 첫 번째 자리" name="code1" maxlength="1"
                        autocapitalize="characters" autocomplete="off" spellcheck="false" required />
                    <input class="join-code-digit" aria-label="학급코드 두 번째 자리" name="code2" maxlength="1"
                        autocapitalize="characters" autocomplete="off" spellcheck="false" required />
                    <input class="join-code-digit" aria-label="학급코드 세 번째 자리" name="code3" maxlength="1"
                        autocapitalize="characters" autocomplete="off" spellcheck="false" required />
                    <input class="join-code-digit" aria-label="학급코드 네 번째 자리" name="code4" maxlength="1"
                        autocapitalize="characters" autocomplete="off" spellcheck="false" required />
                    <input class="join-code-digit" aria-label="학급코드 다섯 번째 자리" name="code5" maxlength="1"
                        autocapitalize="characters" autocomplete="off" spellcheck="false" required />
                </div>
            </fieldset>

            <p id="joinClassStatus" class="join-class-status" role="status" aria-live="polite"></p>
            <button type="submit" class="join-submit">입장</button>
        </form>
    </dialog>

    <dialog id="classroomManageDialog" class="classroom-manage-dialog" aria-labelledby="classroomManageTitle">
        <form novalidate>
            <h2 id="classroomManageTitle" data-title></h2>
            <p data-description></p>
            <div data-name-group hidden>
                <label for="memberNameInput">학생 이름</label>
                <input id="memberNameInput" maxlength="50" autocomplete="off" />
            </div>
            <p class="management-status" role="status" aria-live="polite"></p>
            <div class="management-buttons">
                <button type="button" data-cancel>취소</button>
                <button type="submit"></button>
            </div>
        </form>
    </dialog>

    <!-- 설정 모달 -->
    <div id="settingsModal" class="settings-overlay" hidden>
        <section class="settings-card">
            <div class="settings-heading">
                <h2>계정 설정</h2>
                <button type="button" id="closeSettings" aria-label="설정 닫기">×</button>
            </div>

            <p id="accountEmail"></p>

            <button type="button" id="logoutButton">
                로그아웃
            </button>

            <p id="settingsStatus" role="status"></p>
        </section>
    </div>

</body>

</html>
