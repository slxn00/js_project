<!DOCTYPE html>
<html lang="ko">

<head>
    <link rel="icon" type="image/png" href="/js_project_icon.png">
    <link rel="apple-touch-icon" href="/ios_icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>관리자 · 내 클래스</title>

    <link rel="stylesheet" href="/src/css/main.css">
    <link rel="stylesheet" href="/src/css/admin.css">
    <script type="module" src="/src/js/admin.js"></script>
</head>


<body>
    <!-- 학급 생성 모달 -->
    <div id="createClassModal" class="class-modal-overlay" hidden>
        <iframe id="createClassFrame" title="학급 생성하기" src="about:blank"></iframe>
    </div>


    <div class="app">

        <div class="app-layout">


            <!-- 왼쪽: 학교 학사일정 -->
            <main class="main-content" aria-label="학교 학사일정">
                <div class="admin-overview">

                    <section id="adminCalendar" class="calendar-panel" aria-labelledby="adminCalendarTitle" hidden>


                        <div class="calendar-panel-top">

                            <div class="calendar-title-actions">
                                <h2 id="adminCalendarTitle">학교 학사일정</h2>

                                <button type="button" id="openCustomEventModal" class="calendar-add-button">
                                    + 일정 추가
                                </button>
                            </div>

                            <div class="calendar-nav">

                                <button type="button" id="calendarRefresh" class="calendar-refresh">새로고침</button>
                                <button type="button" id="calendarPrev" aria-label="이전 달">‹</button>
                                <strong id="calendarMonth" aria-live="polite"></strong>
                                <button type="button" id="calendarNext" aria-label="다음 달">›</button>
                            </div>
                        </div>

                        <div class="calendar-weekdays" aria-hidden="true">
                            <span>일</span>
                            <span>월</span>
                            <span>화</span>
                            <span>수</span>
                            <span>목</span>
                            <span>금</span>
                            <span>토</span>
                        </div>

                        <div id="neisSchoolChoices" hidden></div>

                        <div id="calendarDays" class="calendar-days" role="group" aria-label="학사일정 날짜 선택">
                        </div>

                        <div class="calendar-day-detail" aria-live="polite">
                            <strong id="calendarSelectedDate">
                                날짜를 선택해 주세요
                            </strong>

                            <div id="calendarDayEvents">
                                등록된 학사일정이 아직 없어요.
                            </div>
                        </div>

                        <p id="calendarStatus" class="calendar-footnote">
                            학사일정을 불러오고 있어요...
                        </p>

                    </section>

                </div>
            </main>


            <!-- 오른쪽: 기존 관리자 패널 -->
            <aside class="sidebar">

                <header class="sidebar-header">

                    <div class="profile-row">
                        <div class="profile-avatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                                <circle cx="12" cy="8" r="4"></circle>
                                <path d="M4.5 21c0-4 3-7 7.5-7s7.5 3 7.5 7">
                                </path>
                            </svg>
                        </div>

                        <div class="profile-details">
                            <strong id="teacherName">teacher</strong>
                            <span id="teacherEmail">계정 확인 중...</span>
                            <small id="accountRole" class="account-role">학급 확인 중</small>
                        </div>

                        <button type="button" id="settingsButton" class="settings-button" aria-label="설정">
                            ⚙
                        </button>
                    </div>

                    <!-- 사이드바 탭 -->
                    <nav class="tabs" aria-label="학급 메뉴">

                        <button type="button" class="tab active" data-tab="classes" aria-pressed="true">
                            내 클래스
                        </button>

                        <button type="button" class="tab" data-tab="members" aria-pressed="false" hidden>
                            멤버
                        </button>

                        <button type="button" class="tab" data-tab="board">
                            게시판
                        </button>

                    </nav>
                </header>

                <!-- 탭별 내용 -->
                <div class="sidebar-body">

                    <section id="membersPanel" class="tab-panel" hidden>
                        <div class="empty-state">
                            <p>학급 정보를 불러오고 있어요.</p>
                        </div>
                    </section>

                    <section id="classesPanel" class="tab-panel">
                        <div class="empty-state">
                            <p>학급 정보를 불러오고 있어요.</p>
                        </div>
                    </section>

                    <section id="boardPanel" class="tab-panel" hidden>
                        <div class="empty-state">
                            <p>게시판은 추후 추가될 예정입니다.</p>
                        </div>
                    </section>

                </div>

                <div class="sidebar-actions">
                    <button type="button" id="joinClassButton" class="join-class-button" aria-haspopup="dialog"
                        disabled>학급 생성하기</button>
                    <p id="joinClassSummary" class="join-class-summary" role="status" hidden></p>
                </div>

            </aside>

        </div>
    </div>

    <dialog id="classroomManageDialog" class="classroom-manage-dialog" aria-labelledby="classroomManageTitle">
        <form novalidate>
            <h2 id="classroomManageTitle" data-title></h2>
            <p data-description></p>
            <div data-name-group hidden>
                <label for="memberNameInput">학생 이름</label>
                <input id="memberNameInput" maxlength="50" autocomplete="off" />
            </div>
            <p class="management-status" role="status" aria-live="polite"></p>
            <div class="management-buttons">
                <button type="button" data-cancel>취소</button>
                <button type="submit"></button>
            </div>
        </form>
    </dialog>

    <!-- 설정 모달 -->
    <div id="settingsModal" class="settings-overlay" hidden>
        <section class="settings-card">
            <div class="settings-heading">
                <h2>계정 설정</h2>
                <button type="button" id="closeSettings" aria-label="설정 닫기">×</button>
            </div>

            <p id="accountEmail"></p>

            <button type="button" id="logoutButton">
                로그아웃
            </button>

            <p id="settingsStatus" role="status"></p>
        </section>
    </div>

    <dialog id="calendarEditor" class="calendar-editor" aria-labelledby="calendarEditorTitle">
        <form id="calendarPeriodForm" novalidate>
            <div class="calendar-editor-head">
                <div>
                    <h2 id="calendarEditorTitle">학사일정 추가</h2>
                    <p>등록한 일정은 우리 학급 학생에게 표시됩니다.</p>
                </div>
                <button type="button" id="closeCalendarEditor" class="calendar-editor-close" aria-label="닫기">×</button>
            </div>
            <label for="periodEventName">일정명 <span class="required-mark">*</span></label>
            <input id="periodEventName" type="text" maxlength="100" placeholder="예: 중간고사" required>
            <div class="calendar-editor-dates">
                <div>
                    <label for="periodEventStart">시작일 <span class="required-mark">*</span></label>
                    <input id="periodEventStart" type="date" required>
                </div>
                <div>
                    <label for="periodEventEnd">종료일 <span class="required-mark">*</span></label>
                    <input id="periodEventEnd" type="date" required>
                </div>
            </div>
            <label for="periodEventDescription">설명 (선택)</label>
            <textarea id="periodEventDescription" rows="3" maxlength="500" placeholder="일정에 대한 설명"></textarea>
            <p id="periodEventError" class="calendar-editor-error" role="status"></p>
            <button type="submit" class="calendar-editor-submit">일정 등록하기</button>
        </form>
    </dialog>

    <template id="calendarWeekTemplate"><div class="schedule-week"><div class="schedule-bars" aria-hidden="true"></div></div></template>
    <template id="calendarBlankTemplate"><span class="schedule-empty" aria-hidden="true"></span></template>
    <template id="calendarDayTemplate"><button type="button" class="schedule-day"><span class="schedule-day-number"></span></button></template>
    <template id="calendarBarTemplate"><div class="schedule-bar"></div></template>
    <template id="calendarSchoolTemplate"><button type="button"></button></template>
    <template id="calendarDetailTemplate">
        <div class="schedule-details-row"><span></span><button type="button">삭제</button></div>
    </template>
    <template id="adminClassCardTemplate">
        <article class="created-class-card">
            <h3></h3><p></p><strong class="class-code"></strong><small>학급 참여코드</small>
            <button type="button" class="delete-class-button"></button>
        </article>
    </template>
    <template id="adminClassPanelTemplate">
        <div class="class-panel-content">
            <h2 class="class-section-title">내 클래스</h2>
            <div class="created-classes" data-joined></div>
            <p id="joinedClassesStatus" class="class-list-status" role="status"></p>
            <h2 class="class-section-title" data-owned-heading>관리 중인 클래스</h2>
            <div class="created-classes" data-owned></div>
            <button type="button" class="create-class-button">+ 새 학급 생성하기</button>
        </div>
    </template>
    <template id="membersPanelTemplate">
        <section class="members-view">
            <div class="members-heading"><h2>학급 멤버</h2><span id="memberCount">0명</span></div>
            <button type="button" id="refreshMembers" class="refresh-members">새로고침</button>
            <p id="membersStatus" class="members-status" role="status"></p>
            <ul id="membersList" class="members-list"></ul>
        </section>
    </template>
    <template id="memberRowTemplate">
        <li class="member-row">
            <span class="member-avatar" aria-hidden="true"></span>
            <div><strong></strong><small></small></div>
            <details class="member-actions" name="member-actions">
                <summary class="member-menu-toggle" title="학생 관리">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/>
                    </svg>
                </summary>
                <div class="member-menu">
                    <button type="button" data-edit>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 4 4 4M4 20l4-1 12-12a2.8 2.8 0 0 0-4-4L4 15z"/></svg>
                        <span>이름 수정</span>
                    </button>
                    <button type="button" class="remove-member-button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg>
                        <span>학생 삭제</span>
                    </button>
                </div>
            </details>
        </li>
    </template>
</body>


</html>
