<!DOCTYPE html>
<html lang="ko">

<head>
    <link rel="icon" type="image/png" href="/js_project_icon.png">
    <link rel="icon" href="/js_project_icon.png">
    <link rel="apple-touch-icon" href="/js_project_icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 위치 인증</title>
    <link rel="stylesheet" href="/src/css/location.css">
    <script type="module" src="/src/js/location.js"></script>
</head>

<body>
    <main class="location-card">
        <h1>학교 위치 인증</h1>
        <p class="description">
            현재 위치가 등록된 학교의 인증 범위 안에 있는지 확인해요.
        </p>

        <label for="schoolName">학교 이름</label>
        <input id="schoolName" value="테스트 학교" placeholder="학교 이름">

        <label for="latitude">학교 위도</label>
        <input id="latitude" type="number" step="any" value="37.5665">

        <label for="longitude">학교 경도</label>
        <input id="longitude" type="number" step="any" value="126.9780">

        <label for="radius">인증 반경 (미터)</label>
        <input id="radius" type="number" min="1" max="5000" value="200">

        <button id="checkLocation">현재 위치 확인하기</button>

        <p id="status" role="status" aria-live="polite">
            학교 좌표를 설정한 다음 버튼을 눌러 주세요.
        </p>

        <section id="result" hidden>
            <h2 id="resultTitle"></h2>
            <p id="resultDetail"></p>
            <p id="accuracy"></p>
        </section>
    </main>
</body>

</html>
