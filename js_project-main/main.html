<!doctype html>
<html lang="ko">

<head>
  <link rel="icon" type="image/png" href="/js_project_icon.png">
  <link rel="icon" href="/js_project_icon.png">
  <link rel="apple-touch-icon" href="/ios_icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학급 시작하기</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: #f3f6fc;
      color: #17233d;
      padding: 20px
    }

    main {
      width: min(440px, 100%);
      border-radius: 22px;
      background: white;
      padding: 28px;
      box-shadow: 0 16px 45px #1c366318
    }

    .mark {
      display: inline-grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 15px;
      background: #eaf1ff;
      color: #347df1;
      font-size: 24px
    }

    h1 {
      margin: 16px 0 8px;
      font-size: 24px
    }

    p {
      line-height: 1.65;
      color: #687991;
      font-size: 14px
    }

    nav {
      display: grid;
      gap: 10px;
      margin-top: 24px
    }

    a {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #347df1;
      color: white;
      border-radius: 12px;
      padding: 14px;
      font-weight: 700
    }

    a:last-child {
      background: #eff4ff;
      color: #246be0
    }

    #routeMessage {
      margin-top: 20px;
      font-size: 13px
    }
  </style>
  <script type="module" src="/src/js/main.js"></script>
</head>

<body>
  <main>
    <span class="mark" aria-hidden="true">⌂</span>
    <h1>우리 학급 시작하기</h1>
    <p>이미 받은 학급코드가 있나요? 코드로 학급에 들어가거나 직접 학급을 만들 수 있어요.</p>
    <p id="routeMessage" role="status" aria-live="polite">학급 정보를 불러오는 중...</p>
    <nav id="routeChoices" hidden>
      <a href="/student.html">이미 받은 학급코드가 있어요!</a>
      <a href="/admin.html">아뇨, 저는 학급을 생성해야 해요!</a>
    </nav>
  </main>
</body>

</html>
